services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: travel_assistant_db_dev
    environment:
      POSTGRES_DB: travel_assistant_auth
      POSTGRES_USER: travel_user
      POSTGRES_PASSWORD: travel_password
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./backend/auth-backend/create_database.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_user -d travel_assistant_auth"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travel_network_dev

  # Auth Backend (Development)
  auth-backend:
    build:
      context: ./backend/auth-backend
      dockerfile: Dockerfile
    container_name: travel_assistant_auth_backend_dev
    environment:
      DATABASE_URL: postgresql+asyncpg://travel_user:travel_password@db:5432/travel_assistant_auth
      SECRET_KEY: dev-secret-key-not-for-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      API_PREFIX: /api/v1
      ENV: development
      LOG_LEVEL: DEBUG
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost
    ports:
      - "8001:8001"
    volumes:
      - ./backend/auth-backend:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # FIXED: Changed from requests library to urllib.request (standard library, no dependencies)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - travel_network_dev
    restart: unless-stopped

  # Frontend (Development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # IMPORTANT: These are BUILD-TIME variables baked into the image
        # Changing them requires: docker-compose -f docker-compose.dev.yml build frontend
        - VITE_API_BASE_URL=http://localhost:8001/api/v1  # Build-time only
        - VITE_CHATGPT_API_KEY=${VITE_CHATGPT_API_KEY:-}
        - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY:-}
        - VITE_NODE_ENV=${VITE_NODE_ENV:-development}
    container_name: travel_assistant_frontend_dev
    ports:
      - "3000:80"
    depends_on:
      - auth-backend
    networks:
      - travel_network_dev
    restart: unless-stopped

volumes:
  postgres_data_dev:
    driver: local

networks:
  travel_network_dev:
    driver: bridge
