version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: travel_assistant_db
    environment:
      POSTGRES_DB: travel_assistant_auth
      POSTGRES_USER: travel_user
      POSTGRES_PASSWORD: travel_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/auth-backend/create_database.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_user -d travel_assistant_auth"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travel_network

  # Auth Backend
  auth-backend:
    build:
      context: ./backend/auth-backend
      dockerfile: Dockerfile
    container_name: travel_assistant_auth_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://travel_user:travel_password@db:5432/travel_assistant_auth
      SECRET_KEY: your-super-secret-key-change-in-production-make-it-very-long-and-random
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      API_PREFIX: /api/v1
      ENV: production
      LOG_LEVEL: INFO
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8001/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - travel_network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8001/api/v1
    container_name: travel_assistant_frontend
    ports:
      - "3000:80"
    depends_on:
      - auth-backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - travel_network
    restart: unless-stopped

  # Nginx Reverse Proxy (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: travel_assistant_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - auth-backend
    networks:
      - travel_network
    restart: unless-stopped
    profiles:
      - production

volumes:
  postgres_data:
    driver: local

networks:
  travel_network:
    driver: bridge
