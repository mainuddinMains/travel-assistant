services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: travel_assistant_db
    environment:
      POSTGRES_DB: travel_assistant_auth
      POSTGRES_USER: travel_user
      POSTGRES_PASSWORD: travel_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/auth-backend/create_database.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"  # FIXED: Production uses 5433 to avoid conflicts with local PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_user -d travel_assistant_auth"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travel_network
    restart: unless-stopped  # FIXED: Added missing restart policy

  # Auth Backend
  auth-backend:
    build:
      context: ./backend/auth-backend
      dockerfile: Dockerfile
    container_name: travel_assistant_auth_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://travel_user:travel_password@db:5432/travel_assistant_auth
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      ENV: ${ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost}
    env_file:
      - .env
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # FIXED: Changed from requests library to urllib.request (standard library, no dependencies)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - travel_network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # FIXED: Added comment explaining build-time variables
        # IMPORTANT: These are BUILD-TIME variables baked into the image
        # Changing them requires: docker-compose build frontend
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8001/api/v1}  # Build-time only
        - VITE_CHATGPT_API_KEY=${VITE_CHATGPT_API_KEY}
        - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY}
        - VITE_NODE_ENV=${VITE_NODE_ENV:-production}
    # FIXED: Removed misleading env_file - build args are used, not runtime env
    container_name: travel_assistant_frontend
    ports:
      - "3000:80"
    depends_on:
      - auth-backend
    healthcheck:
      # FIXED: Added --quiet flag for cleaner output
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - travel_network
    restart: unless-stopped

  # Nginx Reverse Proxy (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: travel_assistant_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # FIXED: Commented out SSL volume mount - directory doesn't exist yet
      # Uncomment when SSL certificates are configured:
      # - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - auth-backend
    networks:
      - travel_network
    restart: unless-stopped
    profiles:
      - production

volumes:
  postgres_data:
    driver: local

networks:
  travel_network:
    driver: bridge
