            </div>
        </div>
    </div>

    <!-- Floating Chat Toggle Button -->
    <button class="btn-chat-toggle" onclick="toggleChat()" id="chatToggleBtn" title="Toggle chat">
        <span class="arrow">◀</span>
        <span>Chat</span>
    </button>

    <!-- Frontend Configuration (contains API keys) -->
    <script src="config.js"></script>

    <!-- Google Maps API will be loaded dynamically from config -->
    <script>
        const API_BASE = 'http://localhost:8000';
        let sessionId = null;
        let currentRecommendations = null;
        let currentRouteData = null;
        let map = null;
        let markers = [];
        let directionsRenderer = null;
        let directionsService = null;
        let selectedTransportMode = 'driving'; // Default transport mode
        let transitRenderers = []; // Store multiple renderers for transit legs

        // Initialize Google Map
        function initMap() {
            map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: 38.627, lng: -90.199 }, // Default: Saint Louis, USA
                zoom: 12,
                mapTypeControl: false, // Hide Map/Satellite buttons
                streetViewControl: false, // Hide Street View pegman icon
                styles: [
                    {
                        featureType: "poi",
                        elementType: "labels",
                        stylers: [{ visibility: "off" }]
                    }
                ]
            });

            directionsService = new google.maps.DirectionsService();
            directionsRenderer = new google.maps.DirectionsRenderer({
                map: map,
                suppressMarkers: false,
                polylineOptions: {
                    strokeColor: '#2563eb',
                    strokeWeight: 5
                }
            });
        }

        // Clear all markers and routes
        function clearMarkers() {
            markers.forEach(marker => marker.setMap(null));
            markers = [];

            // Clear main directions renderer
            if (directionsRenderer) {
                directionsRenderer.setMap(null);
                directionsRenderer = new google.maps.DirectionsRenderer({
                    map: map,
                    suppressMarkers: false,
                    polylineOptions: {
                        strokeColor: '#2563eb',
                        strokeWeight: 5
                    }
                });
            }

            // Clear all transit leg renderers
            transitRenderers.forEach(renderer => renderer.setMap(null));
            transitRenderers = [];
        }

        // Show places on map
        function showPlacesOnMap(places) {
            clearMarkers();

            const bounds = new google.maps.LatLngBounds();

            places.forEach((place, index) => {
                const geocoder = new google.maps.Geocoder();
                geocoder.geocode({ address: place.formatted_address || place.address }, (results, status) => {
                    if (status === 'OK') {
                        const position = results[0].geometry.location;

                        const marker = new google.maps.Marker({
                            position: position,
                            map: map,
                            label: {
                                text: (index + 1).toString(),
                                color: 'white',
                                fontWeight: 'bold'
                            },
                            title: place.name
                        });

                        const infoWindow = new google.maps.InfoWindow({
                            content: `
                                <div style="padding: 10px; max-width: 250px;">
                                    <h3 style="margin: 0 0 8px 0;">${place.name}</h3>
                                    <p style="margin: 0 0 5px 0; font-size: 0.9em;">${place.address}</p>
                                    ${place.rating ? `<p style="margin: 0; color: #fbbf24;">⭐ ${place.rating} (${place.number_of_reviews} reviews)</p>` : ''}
                                </div>
                            `
                        });

                        marker.addListener('click', () => {
                            infoWindow.open(map, marker);
                        });

                        markers.push(marker);
                        bounds.extend(position);

                        if (markers.length === places.length) {
                            map.fitBounds(bounds);
                        }
                    }
                });
            });
        }

        // Show transit route on map (using backend leg-by-leg data)
        function showTransitRouteOnMap(optimizedRoute, legs) {
            clearMarkers();

            if (!legs || legs.length === 0) return;

            console.log('Displaying transit route with', legs.length, 'legs');

            // Display each leg separately on the map
            let completedLegs = 0;
            const bounds = new google.maps.LatLngBounds();

            legs.forEach((leg, index) => {
                const request = {
                    origin: optimizedRoute[index],
                    destination: optimizedRoute[index + 1],
                    travelMode: google.maps.TravelMode.TRANSIT,
                    transitOptions: {
                        departureTime: new Date(Date.now() + 60000) // 1 minute from now
                    }
                };

                directionsService.route(request, (result, status) => {
                    if (status === 'OK') {
                        // Create a separate renderer for each leg with different colors
                        const colors = ['#4285F4', '#DB4437', '#F4B400', '#0F9D58', '#AB47BC', '#00ACC1'];
                        const legRenderer = new google.maps.DirectionsRenderer({
                            map: map,
                            directions: result,
                            preserveViewport: true,
                            suppressMarkers: false,
                            polylineOptions: {
                                strokeColor: colors[index % colors.length],
                                strokeWeight: 5,
                                strokeOpacity: 0.7
                            }
                        });

                        // Store the renderer so we can clear it later
                        transitRenderers.push(legRenderer);

                        completedLegs++;

                        // Extend bounds with this leg's route
                        const route = result.routes[0];
                        route.overview_path.forEach(point => bounds.extend(point));

                        // Once all legs are rendered, fit the map
                        if (completedLegs === legs.length) {
                            map.fitBounds(bounds);
                        }
                    } else {
                        console.error(`Transit leg ${index} failed:`, status);
                        // Fallback: show markers for this leg
                        const geocoder = new google.maps.Geocoder();
                        geocoder.geocode({ address: optimizedRoute[index] }, (results, status) => {
                            if (status === 'OK') {
                                const marker = new google.maps.Marker({
                                    position: results[0].geometry.location,
                                    map: map,
                                    label: (index + 1).toString(),
                                    title: optimizedRoute[index]
                                });
                                markers.push(marker);
                                bounds.extend(results[0].geometry.location);
                            }
                        });
                    }
                });
            });
        }

        // Show route on map (for non-transit modes)
        function showRouteOnMap(optimizedRoute) {
            clearMarkers();

            if (optimizedRoute.length < 2) return;

            // Map transport mode to Google Maps TravelMode
            const travelModeMap = {
                'driving': google.maps.TravelMode.DRIVING,
                'walking': google.maps.TravelMode.WALKING,
                'bicycling': google.maps.TravelMode.BICYCLING,
                'transit': google.maps.TravelMode.TRANSIT
            };

            const travelMode = travelModeMap[selectedTransportMode] || google.maps.TravelMode.DRIVING;

            const waypoints = optimizedRoute.slice(1, -1).map(addr => ({
                location: addr,
                stopover: true
            }));

            const request = {
                origin: optimizedRoute[0],
                destination: optimizedRoute[optimizedRoute.length - 1],
                waypoints: waypoints,
                travelMode: travelMode,
            };

            directionsService.route(request, (result, status) => {
                if (status === 'OK') {
                    directionsRenderer.setDirections(result);
                } else {
                    console.error('Directions request failed:', status);
                    addMessage(`⚠️ Could not display route on map: ${status}`, 'system');

                    // Fallback: show markers
                    const bounds = new google.maps.LatLngBounds();
                    const geocoder = new google.maps.Geocoder();

                    optimizedRoute.forEach((address, index) => {
                        geocoder.geocode({ address: address }, (results, status) => {
                            if (status === 'OK') {
                                const position = results[0].geometry.location;
                                const marker = new google.maps.Marker({
                                    position: position,
                                    map: map,
                                    label: {
                                        text: (index + 1).toString(),
                                        color: 'white',
                                        fontWeight: 'bold'
                                    },
                                    title: address
                                });
                                markers.push(marker);
                                bounds.extend(position);

                                if (markers.length === optimizedRoute.length) {
                                    map.fitBounds(bounds);
                                }
                            }
                        });
                    });
                }
            });
        }

        // Select transportation mode
        function selectTransportMode(mode) {
            selectedTransportMode = mode;

            // Update button states
            document.querySelectorAll('.btn-transport-mode').forEach(btn => {
                if (btn.dataset.mode === mode) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            console.log(`Selected transport mode: ${mode}`);
        }

        // Toggle chat visibility
        function toggleChat() {
            const chatColumn = document.getElementById('rightColumn');
            const chatToggleBtn = document.getElementById('chatToggleBtn');
            const splitter = document.getElementById('verticalSplitter2');
            const arrow = chatToggleBtn.querySelector('.arrow');
            const leftColumn = document.querySelector('.left-column');
            const middleColumn = document.getElementById('middleColumn');

            if (chatColumn.classList.contains('hidden')) {
                // Show chat - restore original flex ratios
                chatColumn.classList.remove('hidden');
                chatToggleBtn.classList.remove('hidden');
                if (splitter) splitter.classList.remove('hidden');
                if (arrow) arrow.textContent = '◀'; // Arrow pointing left (to hide)

                // Reset to default flex ratios
                leftColumn.style.flex = '2';
                middleColumn.style.flex = '1.5';
            } else {
                // Hide chat - expand left and middle columns
                chatColumn.classList.add('hidden');
                chatToggleBtn.classList.add('hidden');
                if (splitter) splitter.classList.add('hidden');
                if (arrow) arrow.textContent = '▶'; // Arrow pointing right (to show)

                // Expand columns to fill the space
                leftColumn.style.flex = '2';
                middleColumn.style.flex = '1.5';
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();

            if (!message) return;

            input.disabled = true;
            document.getElementById('sendBtn').disabled = true;

            addMessage(message, 'user');
            input.value = '';

            // Show loading indicator
            const loadingDiv = addMessage('⏳ Thinking...', 'bot');

            try {
                const response = await fetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        session_id: sessionId
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                // Parse JSON response (non-streaming)
                const data = await response.json();

                // Remove loading message
                if (loadingDiv && loadingDiv.parentNode) {
                    loadingDiv.parentNode.removeChild(loadingDiv);
                }

                // Update session ID
                sessionId = data.session_id;

                // Display welcome message if it's a new session
                if (data.is_new_session && data.welcome_message) {
                    addMessage(data.welcome_message, 'bot');
                }

                // Display bot response
                addMessage(data.response, 'bot');

                // If recommendations were found, load them
                if (data.has_recommendations) {
                    addMessage('✨ Great! I found some recommendations. Check above!', 'system');
                    await loadRecommendations();
                } else {
                    // Start polling for recommendations (background task might still be processing)
                    startPollingForRecommendations();
                }

            } catch (error) {
                // Remove loading message on error
                if (loadingDiv && loadingDiv.parentNode) {
                    loadingDiv.parentNode.removeChild(loadingDiv);
                }
                addMessage(`Connection error: ${error.message}. Make sure the server is running!`, 'system');
                console.error('Error:', error);
            } finally {
                input.disabled = false;
                document.getElementById('sendBtn').disabled = false;
                input.focus();
            }
        }

        // Create a placeholder message element for streaming
        function createStreamingMessage() {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot';
            messageDiv.innerHTML = `
                <div class="message-avatar bot">
                    <svg class="message-avatar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg>
                </div>
                <div class="message-content"></div>
            `;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return messageDiv;
        }

        // Append text to streaming message
        function appendToStreamingMessage(messageDiv, text) {
            const contentDiv = messageDiv.querySelector('.message-content');

            // Convert line breaks to <br> tags and preserve formatting
            const formattedText = text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\n/g, '<br>');

            contentDiv.innerHTML += formattedText;

            // Auto-scroll to bottom
            const messagesDiv = document.getElementById('chatMessages');
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Finalize streaming message
        function finalizeStreamingMessage(messageDiv) {
            // Just ensure final scroll
            const messagesDiv = document.getElementById('chatMessages');
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function addMessage(text, type) {
            const messagesDiv = document.getElementById('chatMessages');

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;

            // Convert line breaks to <br> tags and escape HTML
            const formattedText = text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\n/g, '<br>');

            if (type === 'bot') {
                messageDiv.innerHTML = `
                    <div class="message-avatar bot">
                        <svg class="message-avatar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                        </svg>
                    </div>
                    <div class="message-content">${formattedText}</div>
                `;
            } else if (type === 'user') {
                messageDiv.innerHTML = `
                    <div class="message-avatar user">
                        <svg class="message-avatar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                    </div>
                    <div class="message-content">${formattedText}</div>
                `;
            } else if (type === 'system') {
                messageDiv.innerHTML = `
                    <div class="message-content">${formattedText}</div>
                `;
            }

            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            // Return the message div so it can be removed later (e.g., loading message)
            return messageDiv;
        }

        // Polling variables
        let pollingInterval = null;
        let pollingAttempts = 0;
        const MAX_POLLING_ATTEMPTS = 30; // Poll for up to 30 seconds (30 attempts * 1 second)

        function startPollingForRecommendations() {
            // Clear any existing polling
            if (pollingInterval) {
                clearInterval(pollingInterval);
            }

            pollingAttempts = 0;

            // Poll every second
            pollingInterval = setInterval(async () => {
                pollingAttempts++;

                try {
                    const response = await fetch(`${API_BASE}/recommendations/${sessionId}`);

                    if (response.ok) {
                        const data = await response.json();

                        // If we got recommendations, stop polling and load them
                        if (data.places && data.places.length > 0) {
                            clearInterval(pollingInterval);
                            pollingInterval = null;

                            console.log('✓ Recommendations ready after', pollingAttempts, 'seconds');
                            addMessage('✨ Great! I found some recommendations. Check above!', 'system');
                            await loadRecommendations();
                        }
                    }
                } catch (error) {
                    console.error('Polling error:', error);
                }

                // Stop polling after max attempts
                if (pollingAttempts >= MAX_POLLING_ATTEMPTS) {
                    console.log('⚠ Stopped polling after', MAX_POLLING_ATTEMPTS, 'attempts');
                    clearInterval(pollingInterval);
                    pollingInterval = null;
                }
            }, 1000); // Poll every 1 second
        }

        async function loadRecommendations() {
            const content = document.getElementById('placesContent');

            console.log('Loading recommendations for session:', sessionId);

            content.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading recommendations...</p>
                </div>
            `;

            try {
                const response = await fetch(`${API_BASE}/recommendations/${sessionId}`);
                const data = await response.json();

                console.log('Recommendations response:', response.status, data);

                if (response.ok) {
                    console.log('Successfully loaded', data.places.length, 'places');
                    currentRecommendations = data;
                    displayRecommendations(data);
                    showPlacesOnMap(data.places);
                } else {
                    console.error('Failed to load recommendations:', data.detail);
                    content.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">❌</div>
                            <p>Error: ${data.detail}</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading recommendations:', error);
                content.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">❌</div>
                        <p>Error: ${error.message}</p>
                    </div>
                `;
            }
        }

        function displayRecommendations(data) {
            const content = document.getElementById('placesContent');

            console.log('Displaying recommendations:', data);

            // Update header with count and enable button
            const placesCount = document.getElementById('placesCount');
            const quickOptimizeBtn = document.getElementById('quickOptimizeBtn');

            placesCount.textContent = `${data.places.length} Places`;
            placesCount.style.display = 'block';

            // Enable optimization button
            quickOptimizeBtn.disabled = false;
            quickOptimizeBtn.title = 'Optimize route for driving';

            // Render places list
            let html = '<div class="places-list">';

            data.places.forEach((place, index) => {
                html += `
                    <div class="place-card" draggable="true" data-index="${index}">
                        <div class="place-header">
                            <div class="place-title">
                                <div class="place-number">${index + 1}</div>
                                <div>
                                    <div class="place-name">
                                        ${place.map_url ? `<a href="${place.map_url}" target="_blank" rel="noopener noreferrer">${place.name}</a>` : place.name}
                                    </div>
                                    ${place.rating ? `
                                        <div class="place-rating">
                                            <span class="star">⭐</span>
                                            <span>${place.rating}</span>
                                            ${place.number_of_reviews ? `<span>(${place.number_of_reviews} reviews)</span>` : ''}
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                            <div class="place-actions">
                                <span class="drag-handle" title="Drag to reorder">⋮⋮</span>
                                <button class="btn-remove-place" onclick="removePlace(${index})" title="Remove">✕</button>
                            </div>
                        </div>
                        <div class="place-address">📍 ${place.formatted_address || place.address}</div>
                        <div class="place-reason">"${place.reason}"</div>
                        ${place.business_hours && place.business_hours.length > 0 ? `
                            <div class="place-hours">
                                <div class="hours-header">
                                    🕒 Hours
                                    <button class="btn-toggle-hours" onclick="toggleHours(${index})">▼</button>
                                </div>
                                <div class="hours-content" id="hours-${index}">
                                    ${place.business_hours.map(h => `<div class="hour-line">${h}</div>`).join('')}
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            });

            html += '</div>';

            content.innerHTML = html;

            // Attach drag and drop event listeners
            attachDragAndDropListeners();
        }

        async function quickOptimize() {
            const quickBtn = document.getElementById('quickOptimizeBtn');
            const originalContent = quickBtn.innerHTML;

            quickBtn.disabled = true;
            quickBtn.innerHTML = '<span>⏳</span><span>Optimizing...</span>';

            try {
                // For transit mode, add 1 minute to ensure it's in the future
                const departureTime = new Date();
                if (selectedTransportMode === 'transit') {
                    departureTime.setMinutes(departureTime.getMinutes() + 1);
                }

                const response = await fetch(`${API_BASE}/optimize`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        session_id: sessionId,
                        mode: selectedTransportMode,
                        departure_time: departureTime.toISOString()
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    currentRouteData = data;
                    updateSummaryBoxes(data);

                    // Reorder places list based on optimized route
                    reorderPlacesList(data.optimized_route);

                    // For transit mode, use the leg-by-leg data from backend
                    if (selectedTransportMode === 'transit') {
                        showTransitRouteOnMap(data.optimized_route, data.legs);
                    } else {
                        showRouteOnMap(data.optimized_route);
                    }

                    // Create a readable mode name for the message
                    const modeNames = {
                        'driving': 'driving',
                        'walking': 'walking',
                        'bicycling': 'bicycling',
                        'transit': 'transit'
                    };
                    addMessage(`✓ Optimized ${modeNames[selectedTransportMode]} route calculated! Check the map.`, 'system');

                    quickBtn.innerHTML = '<span>✓</span><span>Optimized!</span>';
                    setTimeout(() => {
                        quickBtn.innerHTML = originalContent;
                        quickBtn.disabled = false;
                    }, 2000);
                } else {
                    throw new Error(data.detail || 'Optimization failed');
                }
            } catch (error) {
                console.error('Optimization error:', error);
                addMessage(`✗ Optimization failed: ${error.message}`, 'system');
                quickBtn.innerHTML = '<span>✗</span><span>Error</span>';
                setTimeout(() => {
                    quickBtn.innerHTML = originalContent;
                    quickBtn.disabled = false;
                }, 2000);
            }
        }

        function updateSummaryBoxes(data) {
            const distanceKm = (data.total_distance / 1000).toFixed(1);
            const durationMin = Math.round(data.total_duration / 60);

            // Update values
            document.getElementById('totalDistance').textContent = `${distanceKm} km`;
            document.getElementById('totalDuration').textContent = `${durationMin} min`;
        }

        // Reorder places list based on optimized route and add leg info
        function reorderPlacesList(optimizedRoute) {
            if (!currentRecommendations || !optimizedRoute) return;

            // Create a map of address to place object for quick lookup
            const addressToPlace = new Map();
            currentRecommendations.places.forEach(place => {
                const fullAddress = `${place.name}, ${place.address}, ${currentRecommendations.trip_meta.cities}`;
                addressToPlace.set(fullAddress, place);
            });

            // Reorder places based on optimized route
            const reorderedPlaces = [];
            optimizedRoute.forEach(address => {
                const place = addressToPlace.get(address);
                if (place) {
                    reorderedPlaces.push(place);
                }
            });

            // Update currentRecommendations with reordered places
            if (reorderedPlaces.length > 0) {
                currentRecommendations.places = reorderedPlaces;

                // Re-render the places list with route leg information
                displayRecommendationsWithLegs(currentRecommendations, currentRouteData.legs);
            }
        }

        // Display recommendations with leg-by-leg route info
        function displayRecommendationsWithLegs(data, legs) {
            const content = document.getElementById('placesContent');

            // Update header with count
            const placesCount = document.getElementById('placesCount');
            placesCount.textContent = `${data.places.length} Places`;
            placesCount.style.display = 'block';

            // Render places list with route info
            let html = '<div class="places-list">';

            data.places.forEach((place, index) => {
                html += `
                    <div class="place-card" draggable="true" data-index="${index}">
                        <div class="place-header">
                            <div class="place-title">
                                <div class="place-number">${index + 1}</div>
                                <div>
                                    <div class="place-name">
                                        ${place.map_url ? `<a href="${place.map_url}" target="_blank" rel="noopener noreferrer">${place.name}</a>` : place.name}
                                    </div>
                                    ${place.rating ? `
                                        <div class="place-rating">
                                            <span class="star">⭐</span>
                                            <span>${place.rating}</span>
                                            ${place.number_of_reviews ? `<span>(${place.number_of_reviews} reviews)</span>` : ''}
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                            <div class="place-actions">
                                <span class="drag-handle" title="Drag to reorder">⋮⋮</span>
                                <button class="btn-remove-place" onclick="removePlace(${index})" title="Remove">✕</button>
                            </div>
                        </div>
                        <div class="place-address">📍 ${place.formatted_address || place.address}</div>
                        <div class="place-reason">"${place.reason}"</div>
                        ${place.business_hours && place.business_hours.length > 0 ? `
                            <div class="place-hours">
                                <div class="hours-header">
                                    🕒 Hours
                                    <button class="btn-toggle-hours" onclick="toggleHours(${index})">▼</button>
                                </div>
                                <div class="hours-content" id="hours-${index}">
                                    ${place.business_hours.map(h => `<div class="hour-line">${h}</div>`).join('')}
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;

                // Add route info BETWEEN place cards (not after the last place)
                if (legs && index < data.places.length - 1 && legs[index]) {
                    const leg = legs[index];
                    const isTransitMode = currentRouteData.mode === 'transit';
                    const hasSteps = leg.steps && leg.steps.length > 0;
                    // Only show details for transit mode (has valuable info like bus numbers, stops, times)
                    const showDetails = isTransitMode && hasSteps;

                    html += `
                        <div class="place-route-info" data-leg-index="${index}">
                            <div class="route-info-summary">
                                <span class="route-info-arrow">→</span>
                                <div class="route-info-item">
                                    <span>${getTransportIcon(currentRouteData.mode)}</span>
                                    <span>${(leg.distance / 1000).toFixed(1)} km</span>
                                </div>
                                <div class="route-info-item">
                                    <span>⏱️</span>
                                    <span>${Math.round(leg.duration / 60)} min</span>
                                </div>
                                ${showDetails ? `<button class="btn-toggle-details" onclick="toggleRouteDetails(${index})">Details ▼</button>` : ''}
                            </div>
                            ${showDetails ? `
                                <div class="route-details" id="route-details-${index}">
                                    <div class="route-details-content">
                                        ${renderRouteSteps(leg.steps)}
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    `;
                }
            });

            html += '</div>';
            content.innerHTML = html;

            // Attach drag and drop event listeners
            attachDragAndDropListeners();
        }

        // Get transport mode icon
        function getTransportIcon(mode) {
            const icons = {
                'driving': '🚗',
                'transit': '🚌',
                'walking': '🚶',
                'bicycling': '🚴'
            };
            return icons[mode] || '🚗';
        }

        // Toggle route details expansion
        function toggleRouteDetails(index) {
            const detailsDiv = document.getElementById(`route-details-${index}`);
            const button = event.target;

            if (detailsDiv.classList.contains('expanded')) {
                detailsDiv.classList.remove('expanded');
                button.textContent = 'Details ▼';
            } else {
                detailsDiv.classList.add('expanded');
                button.textContent = 'Details ▲';
            }
        }

        // Toggle business hours expansion
        function toggleHours(index) {
            const hoursDiv = document.getElementById(`hours-${index}`);
            const button = event.target;

            if (hoursDiv.classList.contains('expanded')) {
                hoursDiv.classList.remove('expanded');
                button.classList.remove('expanded');
            } else {
                hoursDiv.classList.add('expanded');
                button.classList.add('expanded');
            }
        }

        // Render route steps with transit details
        function renderRouteSteps(steps) {
            if (!steps || steps.length === 0) return '';

            // Combine consecutive walking steps
            const consolidatedSteps = [];
            let i = 0;

            while (i < steps.length) {
                const step = steps[i];

                if (step.mode === 'WALKING') {
                    // Start combining walking steps
                    let totalDistance = step.distance;
                    let totalDuration = step.duration;
                    let walkCount = 1;

                    // Look ahead and combine all consecutive walking steps
                    while (i + walkCount < steps.length && steps[i + walkCount].mode === 'WALKING') {
                        totalDistance += steps[i + walkCount].distance;
                        totalDuration += steps[i + walkCount].duration;
                        walkCount++;
                    }

                    // Add consolidated walking step
                    consolidatedSteps.push({
                        mode: 'WALKING',
                        distance: totalDistance,
                        duration: totalDuration
                    });

                    i += walkCount;
                } else {
                    // Non-walking step, add as-is
                    consolidatedSteps.push(step);
                    i++;
                }
            }

            return consolidatedSteps.map(step => {
                const mode = step.mode;
                const isTransit = mode === 'TRANSIT';
                const isWalking = mode === 'WALKING';

                let stepHtml = `
                    <div class="route-step">
                        <div class="step-icon ${isTransit ? 'transit' : 'walking'}">
                            ${isTransit ? '🚌' : '🚶'}
                        </div>
                        <div class="step-content">
                `;

                if (isTransit && step.transit_details) {
                    const td = step.transit_details;
                    const lineColor = td.line_color ? `#${td.line_color}` : '#fbbf24';
                    const textColor = td.line_text_color ? `#${td.line_text_color}` : '#000000';

                    stepHtml += `
                        <div class="step-mode">${td.vehicle_type || 'Transit'}: ${td.line_short_name || td.line_name || 'Line'}</div>
                        <div class="transit-line" style="background-color: ${lineColor}; color: ${textColor};">
                            ${td.line_short_name || td.line_name}
                        </div>
                        <div class="step-description">
                            From: ${td.departure_stop_name}<br>
                            To: ${td.arrival_stop_name}<br>
                            ${td.num_stops ? `${td.num_stops} stops` : ''}
                        </div>
                        <div class="step-time">
                            🕒 ${td.departure_time} → ${td.arrival_time}
                        </div>
                        <div class="step-time">
                            ${(step.distance / 1000).toFixed(1)} km • ${Math.round(step.duration / 60)} min
                        </div>
                    `;
                } else if (isWalking) {
                    stepHtml += `
                        <div class="step-mode">Walk</div>
                        <div class="step-description">
                            ${(step.distance / 1000).toFixed(2)} km • ${Math.round(step.duration / 60)} min
                        </div>
                    `;
                } else {
                    stepHtml += `
                        <div class="step-mode">${mode}</div>
                        <div class="step-description">
                            ${(step.distance / 1000).toFixed(1)} km • ${Math.round(step.duration / 60)} min
                        </div>
                    `;
                }

                stepHtml += `
                        </div>
                    </div>
                `;

                return stepHtml;
            }).join('');
        }

        // Sync updated places list to backend
        async function syncPlacesToBackend() {
            if (!currentRecommendations || !sessionId) return;

            try {
                await fetch(`${API_BASE}/update-places`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        session_id: sessionId,
                        places: currentRecommendations.places
                    })
                });
            } catch (error) {
                console.error('Error syncing places to backend:', error);
            }
        }

        // Remove a place from the list
        async function removePlace(index) {
            if (!currentRecommendations || !currentRecommendations.places[index]) return;

            // Remove the place
            currentRecommendations.places.splice(index, 1);

            // Clear route data since order changed
            currentRouteData = null;

            // Sync to backend
            await syncPlacesToBackend();

            // Re-render
            displayRecommendations(currentRecommendations);

            // Update map
            showPlacesOnMap(currentRecommendations.places);

            // Clear summary boxes
            document.getElementById('totalDistance').textContent = '-';
            document.getElementById('totalDuration').textContent = '-';
        }

        // Drag and drop variables
        let draggedIndex = null;

        // Attach drag and drop event listeners to place cards
        function attachDragAndDropListeners() {
            const placeCards = document.querySelectorAll('.place-card');

            placeCards.forEach(card => {
                card.addEventListener('dragstart', handleDragStart);
                card.addEventListener('dragover', handleDragOver);
                card.addEventListener('drop', handleDrop);
                card.addEventListener('dragend', handleDragEnd);
                card.addEventListener('dragenter', handleDragEnter);
                card.addEventListener('dragleave', handleDragLeave);
            });
        }

        function handleDragStart(e) {
            draggedIndex = parseInt(e.currentTarget.dataset.index);
            e.currentTarget.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            return false;
        }

        function handleDragEnter(e) {
            const target = e.currentTarget;
            if (target.classList.contains('place-card')) {
                target.classList.add('drag-over');
            }
        }

        function handleDragLeave(e) {
            const target = e.currentTarget;
            if (target.classList.contains('place-card')) {
                target.classList.remove('drag-over');
            }
        }

        async function handleDrop(e) {
            e.preventDefault();
            e.stopPropagation();

            const dropIndex = parseInt(e.currentTarget.dataset.index);

            if (draggedIndex !== null && draggedIndex !== dropIndex) {
                // Reorder the places array
                const places = currentRecommendations.places;
                const draggedPlace = places[draggedIndex];

                // Remove from old position
                places.splice(draggedIndex, 1);

                // Insert at new position
                const newIndex = draggedIndex < dropIndex ? dropIndex - 1 : dropIndex;
                places.splice(newIndex, 0, draggedPlace);

                // Update the recommendations
                currentRecommendations.places = places;

                // Clear route data since order changed
                currentRouteData = null;

                // Sync to backend
                await syncPlacesToBackend();

                // Re-render
                displayRecommendations(currentRecommendations);

                // Update map with new order
                showPlacesOnMap(places);

                // Recalculate route if there was an optimized route
                if (currentRouteData !== null) {
                    recalculateRoute();
                }

                // Clear summary boxes until re-optimized
                document.getElementById('totalDistance').textContent = '-';
                document.getElementById('totalDuration').textContent = '-';
            }

            e.currentTarget.classList.remove('drag-over');
            return false;
        }

        function handleDragEnd(e) {
            e.currentTarget.classList.remove('dragging');

            // Remove drag-over class from all cards
            document.querySelectorAll('.place-card').forEach(card => {
                card.classList.remove('drag-over');
            });

            draggedIndex = null;
        }

        // Recalculate route with current order and mode
        async function recalculateRoute() {
            if (!currentRecommendations || currentRecommendations.places.length < 2) return;

            try {
                const departureTime = new Date();
                if (selectedTransportMode === 'transit') {
                    departureTime.setMinutes(departureTime.getMinutes() + 1);
                }

                const response = await fetch(`${API_BASE}/optimize`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        session_id: sessionId,
                        mode: selectedTransportMode,
                        departure_time: departureTime.toISOString()
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    currentRouteData = data;
                    updateSummaryBoxes(data);

                    // Update display with leg information
                    displayRecommendationsWithLegs(currentRecommendations, data.legs);

                    // Show route on map
                    if (selectedTransportMode === 'transit') {
                        showTransitRouteOnMap(data.optimized_route, data.legs);
                    } else {
                        showRouteOnMap(data.optimized_route);
                    }
                }
            } catch (error) {
                console.error('Error recalculating route:', error);
            }
        }

        function printItinerary() {
            if (!currentRecommendations) {
                alert('No recommendations to print yet. Start chatting to get recommendations!');
                return;
            }
            alert('Print functionality coming soon!');
        }

        // Resize functionality for splitters
        function initResizers() {
            const splitter1 = document.getElementById('verticalSplitter1');
            const splitter2 = document.getElementById('verticalSplitter2');
            const leftColumn = document.querySelector('.left-column');
            const middleColumn = document.getElementById('middleColumn');
            const rightColumn = document.getElementById('rightColumn');

            let isResizing1 = false;
            let isResizing2 = false;

            // Splitter 1 (left-middle resize)
            splitter1.addEventListener('mousedown', (e) => {
                isResizing1 = true;
                splitter1.classList.add('dragging');
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
            });

            // Splitter 2 (middle-right resize)
            splitter2.addEventListener('mousedown', (e) => {
                isResizing2 = true;
                splitter2.classList.add('dragging');
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
            });

            document.addEventListener('mousemove', (e) => {
                const containerRect = document.querySelector('.container').getBoundingClientRect();

                if (isResizing1) {
                    const leftWidth = e.clientX - containerRect.left;
                    const middleStart = leftWidth + 8; // 8px for splitter
                    const remainingWidth = containerRect.width - middleStart;

                    // Set minimum widths
                    if (leftWidth > 270 && remainingWidth > 540) { // 270 min for each column
                        leftColumn.style.flex = `0 0 ${leftWidth}px`;
                    }
                }

                if (isResizing2) {
                    const leftRect = leftColumn.getBoundingClientRect();
                    const middleWidth = e.clientX - leftRect.right - 8; // 8px for first splitter
                    const rightStart = leftRect.right + middleWidth + 16; // 16px for two splitters
                    const rightWidth = containerRect.width - rightStart + containerRect.left;

                    // Set minimum widths
                    if (middleWidth > 270 && rightWidth > 270) {
                        middleColumn.style.flex = `0 0 ${middleWidth}px`;
                        rightColumn.style.flex = `0 0 ${rightWidth}px`;
                    }
                }
            });

            document.addEventListener('mouseup', () => {
                if (isResizing1) {
                    isResizing1 = false;
                    splitter1.classList.remove('dragging');
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                }

                if (isResizing2) {
                    isResizing2 = false;
                    splitter2.classList.remove('dragging');
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                }
            });
        }

        // Load Google Maps API dynamically with API key from config
        function loadGoogleMaps() {
            return new Promise((resolve, reject) => {
                // Check if config is loaded
                if (typeof FRONTEND_CONFIG === 'undefined') {
                    reject(new Error('Frontend config not loaded. Make sure config.js exists!'));
                    return;
                }

                // Check if API key is configured
                if (!FRONTEND_CONFIG.GOOGLE_MAPS_API_KEY || FRONTEND_CONFIG.GOOGLE_MAPS_API_KEY === 'YOUR_GOOGLE_MAPS_API_KEY_HERE') {
                    reject(new Error('Google Maps API key not configured in config.js'));
                    return;
                }

                // Create script tag with API key from config
                const script = document.createElement('script');
                script.src = `https://maps.googleapis.com/maps/api/js?key=${FRONTEND_CONFIG.GOOGLE_MAPS_API_KEY}&libraries=places`;
                script.async = true;
                script.defer = true;
                script.onload = resolve;
                script.onerror = () => reject(new Error('Failed to load Google Maps'));
                document.head.appendChild(script);
            });
        }

        // Display welcome message on page load
        async function displayWelcomeMessage() {
            try {
                const response = await fetch(`${API_BASE}/welcome`);

                if (response.ok) {
                    const data = await response.json();
                    if (data.welcome_message) {
                        addMessage(data.welcome_message, 'bot');
                    }
                }
            } catch (error) {
                console.error('Failed to fetch welcome message:', error);
            }
        }

        // Initialize on load
        window.addEventListener('load', async () => {
            try {
                // Initialize resizers
                initResizers();

                // Load Google Maps first
                await loadGoogleMaps();
                console.log('✓ Google Maps loaded');

                // Initialize map
                initMap();

                // Check backend health and display welcome message
                fetch(`${API_BASE}/health`)
                    .then(response => {
                        if (response.ok) {
                            console.log('✓ Server is running');
                            // Display welcome message once server is confirmed running
                            displayWelcomeMessage();
                        } else {
                            addMessage('⚠️ Server returned an error', 'system');
                        }
                    })
                    .catch(error => {
                        addMessage('⚠️ Cannot connect to server at http://localhost:8000', 'system');
                    });

            } catch (error) {
                console.error('Error loading Google Maps:', error);
                addMessage(`⚠️ Google Maps Error: ${error.message}. Make sure config.js is configured with a valid Google Maps API key.`, 'system');
            }
        });
    </script>
</body>
</html>
